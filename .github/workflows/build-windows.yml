name: Build Windows installer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Install icon generation tools
        run: npm install --no-save --package-lock=false --legacy-peer-deps sharp png-to-ico

      - name: Generate Meshora brand icons
        run: npm run icons:generate

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win:nsis

      - name: Stage installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release | Out-Null

          $exe = Get-ChildItem -Path release-build -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            throw "Windows installer was not produced."
          }
          Copy-Item $exe.FullName "release/Meshora-Setup-$version.exe" -Force

          $zip = Get-ChildItem -Path release-build -Recurse -Filter *.zip | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName "release/Meshora-$version-win32-x64.zip" -Force
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshora-windows
          path: release/*

      - name: Read release version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether version tag already exists
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to check whether release tag $tag exists."
          }
          if ($remoteTag) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release tag $tag already exists; skipping release creation."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release tag $tag is missing; this main-branch build can publish it."
          }

      - name: Publish versioned GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Meshora v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*
