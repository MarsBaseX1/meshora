name: Build Windows installer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backfill submitted SignPath application status on existing releases (one-time)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && contains(github.event.head_commit.message, '[backfill-signpath-submitted-status]')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repo = $env:GITHUB_REPOSITORY
          $releaseTags = @("v1.0.0", "v1.1.0", "v1.1.1", "v1.1.2")
          $oldStatus = "The SignPath Foundation application is being prepared and has not yet been submitted or approved."
          $newStatus = "The SignPath Foundation application form has been submitted and is awaiting review. Acceptance has not been confirmed, and signing is not yet confirmed as active."

          foreach ($tag in $releaseTags) {
            $releaseUrl = "https://api.github.com/repos/$repo/releases/tags/$tag"
            $release = Invoke-RestMethod -Method Get -Uri $releaseUrl -Headers $headers
            if ($release.body.Contains($newStatus)) {
              Write-Host "Application status already updated in $tag; skipping."
              continue
            }
            if (-not $release.body.Contains($oldStatus)) {
              throw "Expected old application status not found in release $tag; refusing to overwrite an unexpected release body."
            }

            $newBody = $release.body.Replace($oldStatus, $newStatus)
            $payload = @{ body = $newBody } | ConvertTo-Json -Depth 5
            $patchUrl = "https://api.github.com/repos/$repo/releases/$($release.id)"
            Invoke-RestMethod -Method Patch -Uri $patchUrl -Headers $headers -ContentType "application/json" -Body $payload | Out-Null
            Write-Host "Updated application status in $tag."
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Install icon generation tools
        run: npm install --no-save --package-lock=false --legacy-peer-deps sharp png-to-ico

      - name: Generate Meshora brand icons
        run: npm run icons:generate

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win:nsis

      - name: Verify app version is embedded in the UI
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json -AsHashtable
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $lockRoot = $lock['packages']['']

          if ($package['version'] -ne $lock['version'] -or $package['version'] -ne $lockRoot['version']) {
            throw "Version mismatch: package.json=$($package['version']), lock=$($lock['version']), lock root=$($lockRoot['version'])"
          }

          $html = Get-Content src/index.html -Raw
          if ($html -match 'Meshora\s+\d+\.\d+\.\d+') {
            throw "Do not hardcode the About version in src/index.html; read it from package.json."
          }

          if ($package.build.win.signAndEditExecutable -ne $true) {
            throw "Windows executable resource editing must be enabled so the custom Meshora icon is embedded."
          }

          $iconPath = "assets/icon.ico"
          if (-not (Test-Path $iconPath)) {
            throw "Generated Windows icon is missing: $iconPath"
          }
          $icon = [System.IO.File]::ReadAllBytes($iconPath)
          if ($icon.Length -lt 1024 -or $icon[0] -ne 0 -or $icon[1] -ne 0 -or $icon[2] -ne 1 -or $icon[3] -ne 0) {
            throw "Generated Windows icon is invalid or unexpectedly small."
          }

          $bundles = Get-ChildItem -Path dist -Recurse -File -Filter *.js
          $embedded = $false
          foreach ($bundle in $bundles) {
            if ((Get-Content $bundle.FullName -Raw).Contains($package.version)) {
              $embedded = $true
              break
            }
          }
          if (-not $embedded) {
            throw "Built UI bundle does not contain package version $($package.version)."
          }
          Write-Host "Verified UI version $($package.version) in the built bundle."

      - name: Stage installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release | Out-Null

          $exe = Get-ChildItem -Path release-build -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            throw "Windows installer was not produced."
          }
          Copy-Item $exe.FullName "release/Meshora-Setup-$version.exe" -Force

          $zip = Get-ChildItem -Path release-build -Recurse -Filter *.zip | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName "release/Meshora-$version-win32-x64.zip" -Force
          }

      - name: Read release version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether version tag already exists
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to check whether release tag $tag exists."
          }
          if ($remoteTag) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release tag $tag already exists; skipping release creation."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release tag $tag is missing; this main-branch build can publish it."
          }

      - name: Check SignPath configuration
        id: signpath-config
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.tag.outputs.exists == 'false'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })

          if ($missing.Count -eq 0) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Host "SignPath is configured. The release will wait for an approved signing request."
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning ("SignPath is not fully configured; this release will remain unsigned. Missing settings: " + ($missing -join ', '))
          }

      - name: Upload unsigned installer for SignPath
        id: upload-signpath-installer
        if: steps.signpath-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: meshora-installer-unsigned-${{ steps.version.outputs.version }}
          path: release/Meshora-Setup-${{ steps.version.outputs.version }}.exe
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Submit Windows installer to SignPath
        id: signpath
        if: steps.signpath-config.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-signpath-installer.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
          skip-decompress: true

      - name: Verify and stage signed installer
        if: steps.signpath-config.outputs.enabled == 'true'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $signed = Get-ChildItem -Path signed-installer -File -Filter *.exe | Select-Object -First 1
          if (-not $signed) {
            throw "SignPath completed without returning a signed EXE installer."
          }

          $signature = Get-AuthenticodeSignature $signed.FullName
          if ($signature.Status -ne 'Valid') {
            throw "The SignPath output does not have a valid Authenticode signature: $($signature.Status) $($signature.StatusMessage)"
          }

          $destination = "release/Meshora-Setup-$env:APP_VERSION.exe"
          Copy-Item $signed.FullName $destination -Force
          Write-Host "Verified signed installer: $destination"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshora-windows
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release notes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.tag.outputs.exists == 'false'
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ steps.signpath-config.outputs.enabled }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:SIGNPATH_ENABLED -eq 'true') {
            $status = "**Release status:** The Windows installer for Meshora $env:APP_VERSION has been signed by SignPath, and the release workflow verified its Authenticode signature as valid. Each signing request is subject to manual approval."
            $attribution = "> Free code signing provided by SignPath.io, certificate by SignPath Foundation."
          } else {
            $status = "**Release status:** The Windows installer for Meshora $env:APP_VERSION is **unsigned**. The SignPath Foundation application has been submitted and is awaiting review; acceptance and signing activation are not yet confirmed. Do not interpret the attribution below as evidence that this installer is signed."
            $attribution = "**Attribution for releases that are actually signed only:**`n> Free code signing provided by SignPath.io, certificate by SignPath Foundation."
          }

          $releaseNotes = @"
          ## Code signing policy

          $status

          $attribution

          See the [Meshora Code Signing Policy](https://github.com/MarsBaseX1/meshora/blob/main/CODE_SIGNING.md).
          "@
          $releaseNotes | Set-Content -Path release-notes.md -Encoding utf8

      - name: Publish versioned GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Meshora v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: release/*
