name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win:nsis

      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exe = Get-ChildItem -Path release-build -Recurse -Filter *.exe | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName release/Meshora-Setup-1.0.0.exe -Force
          }
          $zip = Get-ChildItem -Path release-build -Recurse -Filter *.zip | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName release/Meshora-1.0.0-win32-x64.zip -Force
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshora-windows
          path: |
            release/Meshora-Setup-1.0.0.exe
            release-build/**

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Meshora-Setup-1.0.0.exe
            release-build/*.exe
            release-build/*.zip
