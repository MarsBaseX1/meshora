name: Build Windows installer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Install icon generation tools
        run: npm install --no-save --package-lock=false --legacy-peer-deps sharp png-to-ico

      - name: Generate Meshora brand icons
        run: npm run icons:generate

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win:nsis

      - name: Verify app version is embedded in the UI
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json -AsHashtable
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $lockRoot = $lock['packages']['']

          if ($package['version'] -ne $lock['version'] -or $package['version'] -ne $lockRoot['version']) {
            throw "Version mismatch: package.json=$($package['version']), lock=$($lock['version']), lock root=$($lockRoot['version'])"
          }

          $html = Get-Content src/index.html -Raw
          if ($html -match 'Meshora\s+\d+\.\d+\.\d+') {
            throw "Do not hardcode the About version in src/index.html; read it from package.json."
          }

          if ($package.build.win.signAndEditExecutable -ne $true) {
            throw "Windows executable resource editing must be enabled so the custom Meshora icon is embedded."
          }

          $iconPath = "assets/icon.ico"
          if (-not (Test-Path $iconPath)) {
            throw "Generated Windows icon is missing: $iconPath"
          }
          $icon = [System.IO.File]::ReadAllBytes($iconPath)
          if ($icon.Length -lt 1024 -or $icon[0] -ne 0 -or $icon[1] -ne 0 -or $icon[2] -ne 1 -or $icon[3] -ne 0) {
            throw "Generated Windows icon is invalid or unexpectedly small."
          }

          $bundles = Get-ChildItem -Path dist -Recurse -File -Filter *.js
          $embedded = $false
          foreach ($bundle in $bundles) {
            if ((Get-Content $bundle.FullName -Raw).Contains($package.version)) {
              $embedded = $true
              break
            }
          }
          if (-not $embedded) {
            throw "Built UI bundle does not contain package version $($package.version)."
          }
          Write-Host "Verified UI version $($package.version) in the built bundle."

      - name: Stage installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release | Out-Null

          $exe = Get-ChildItem -Path release-build -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            throw "Windows installer was not produced."
          }
          Copy-Item $exe.FullName "release/Meshora-Setup-$version.exe" -Force

          $zip = Get-ChildItem -Path release-build -Recurse -Filter *.zip | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName "release/Meshora-$version-win32-x64.zip" -Force
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshora-windows
          path: release/*

      - name: Read release version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether version tag already exists
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to check whether release tag $tag exists."
          }
          if ($remoteTag) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release tag $tag already exists; skipping release creation."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release tag $tag is missing; this main-branch build can publish it."
          }

      - name: Publish versioned GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Meshora v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*
